[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-nexus-data"
version = "0.1.0"
description = "Capa confiable de datos y grafo para Knowledge Nexus LATAM"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=6,<7",
  "python-dotenv>=1,<2",
  # Motor de recuperación (persona 2): búsqueda híbrida, ranking y API.
  "numpy>=1.26",
  "PyYAML>=6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Modelo de embeddings. Se instala aparte para poder trabajar sin descargas.
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
knowledge-nexus-data = "knowledge_nexus_data.cli:main"
knowledge-nexus = "knowledge_nexus_retrieval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
